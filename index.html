<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alev Animasyonu Demo (Kick WebSocket ile)</title>
    <style>
        body {
            background: #23272f;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
        }
        .main-card {
            background: #2d323c;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            padding: 32px 32px 24px 32px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 340px;
        }
        .container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 16px;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./desing/background.jpg') no-repeat center center;
            background-size: contain;
            border-radius: 12px;
        }
        .flame {
            width: 64px;
            height: 64px;
            background: url('./desing/2.png') no-repeat;
            background-size: cover;
            position: absolute;
            top: 87px;
            left: 137px;
            animation: burn 0.8s steps(6) infinite;
            display: none;
        }
        @keyframes burn {
            from { background-position: 0 0; }
            to { background-position: calc(-1*6*64px) 0; }
        }
        .level-label {
            color: #fff;
            font-size: 1.2em;
            margin-top: 20px;
            margin-bottom: 0;
            min-height: 1.5em;
            text-align: center;
        }
        hr {
            border: none;
            border-top: 1.5px solid #444a57;
            width: 100%;
            margin: 32px 0 24px 0;
        }
        .form-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-row label {
            color: #bfc7d5;
            font-size: 1em;
        }
        .input-row input[type="text"] {
            padding: 7px 12px;
            border-radius: 6px;
            border: 1px solid #444a57;
            background: #23272f;
            color: #fff;
            font-size: 1em;
            outline: none;
            width: 140px;
        }
        .input-row button {
            background: #4f8cff;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 18px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-row button:hover {
            background: #2563eb;
        }
        .url-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .url-row input[type="text"] {
            width: 220px;
            font-size: 0.98em;
            background: #181b20;
            color: #bfc7d5;
            border: 1px solid #444a57;
            border-radius: 6px;
            padding: 6px 10px;
        }
        .url-row button {
            background: #3bb273;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.98em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .url-row button:hover {
            background: #238a53;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="container">
            <div class="background"></div>
            <div class="flame" id="flame"></div>
        </div>
        <div class="level-label" id="flameLevelLabel"></div>
        <hr>
        <div class="form-section">
            <div class="input-row">
                <label for="usernameInput">Kick Username:</label>
                <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
                <label for="templateSelect">Template:</label>
                <select id="templateSelect"></select>
                <button id="startBtn">Start</button>
            </div>
            <div class="url-row" style="display:none;" id="urlRow">
                <input type="text" id="urlOutput" readonly>
                <button id="copyBtn">Copy</button>
            </div>
        </div>
    </div>
    <script>
        // Global değişkenler (çakışmayı önlemek için)
        let globalWs = null;
        let globalInterval = null;
        let currentTemplate = 'knight';

        // Template klasör isimleri burada tutuluyor
        const templates = ['knight', 'monster']; // desing klasöründeki klasör isimleriyle aynı olmalı

        // Yardımcı fonksiyon: URL parametresinden username ve template al
        function getParamFromUrl(param) {
            const params = new URLSearchParams(window.location.search);
            return params.get(param);
        }

        // Template'e göre görsel yollarını ve konumları döndür
        function getTemplateAssets(template) {
            // Her template için konumlar burada tanımlanır
            const positions = {
                knight: { top: '87px', left: '137px' },
                monster: { top: '150px', left: '120px' } // örnek, ihtiyaca göre değiştirin
            };
            return {
                background: `./desing/${template}/background.jpg`,
                flame: (level) => `./desing/${template}/${level}.png`,
                position: positions[template] || { top: '87px', left: '137px' }
            };
        }

        // Sayfa yüklenirken template seçeneklerini dinamik doldur
        const templateSelect = document.getElementById('templateSelect');
        templateSelect.innerHTML = '';
        templates.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            opt.textContent = t.charAt(0).toUpperCase() + t.slice(1);
            templateSelect.appendChild(opt);
        });

        // Kick API'den chatroom_id al
        async function getChatroomId(username) {
            const apiUrl = `https://kick.com/api/v2/channels/${username}/chatroom`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API hatası');
                const data = await response.json();
                return data.id;
            } catch (e) {
                alert('Chatroom ID alınamadı!');
                return null;
            }
        }

        // Alev animasyonu ve chat fonksiyonları
        async function startFlame(username, template) {
            // Önce eski bağlantı ve interval'ı temizle
            if (globalWs) {
                try { globalWs.close(); } catch (e) {}
                globalWs = null;
            }
            if (globalInterval) {
                clearInterval(globalInterval);
                globalInterval = null;
            }

            const assets = getTemplateAssets(template);
            const flame = document.getElementById('flame');
            const flameLevelLabel = document.getElementById('flameLevelLabel');
            document.querySelector('.background').style.backgroundImage = `url('${assets.background}')`;
            // Konumu ayarla
            flame.style.top = assets.position.top;
            flame.style.left = assets.position.left;
            flame.style.display = 'block';
            flameLevelLabel.textContent = 'Yükleniyor...';

            const CHATROOM_ID = await getChatroomId(username);
            if (!CHATROOM_ID) {
                flameLevelLabel.textContent = 'Alev Seviyesi: - | Mesaj/saniye: -';
                flame.style.display = 'none';
                return;
            }

            const KICK_WS_URL = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0-rc2&flash=false";
            let ws;
            let messageTimestamps = [];
            let flameLevel = 2;
            const minLevel = 1;
            const maxLevel = 5;
            let targetLevel = 2;
            let lastLevelChange = Date.now();
            const levelChangeDelay = 2000; // ms
            let msgPerSec60 = 0;
            let msgPerSec180 = 0;
            let count60 = 0;
            let count180 = 0;

            function updateFlameImage(level, msgPerSec60, msgPerSec180) {
                flame.style.backgroundImage = `url('${assets.flame(level)}')`;
                flameLevelLabel.textContent = `Alev Seviyesi: ${level} | 60sn: ${msgPerSec60.toFixed(2)}/sn | 180sn: ${msgPerSec180.toFixed(2)}/sn`;
            }

            function connectKickWebSocket() {
                ws = new WebSocket(KICK_WS_URL);
                globalWs = ws; // global referans
                ws.onopen = function() {
                    const subscribePayload = {
                        event: "pusher:subscribe",
                        data: {
                            channel: `chatrooms.${CHATROOM_ID}.v2`
                        }
                    };
                    ws.send(JSON.stringify(subscribePayload));
                };
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.event === "App\\Events\\ChatMessageEvent") {
                            messageTimestamps.push(Date.now());
                        }
                    } catch (e) {}
                };
                ws.onclose = function() {
                    // Sadece aktif ws ise reconnect
                    if (globalWs === ws) {
                        setTimeout(connectKickWebSocket, 3000);
                    }
                };
            }

            function updateFlameLevelByActivity() {
                const now = Date.now();
                // Son 180 ve 60 saniyelik mesajları filtrele
                messageTimestamps = messageTimestamps.filter(ts => now - ts < 180000);
                count60 = messageTimestamps.filter(ts => now - ts < 60000).length;
                count180 = messageTimestamps.length;
                msgPerSec60 = count60 / 60;
                msgPerSec180 = count180 / 180;
                // 180 saniyede hiç mesaj yoksa, alev seviyesi 2'de sabit kalsın
                if (count180 === 0) {
                    flameLevel = 2;
                    targetLevel = 2;
                    updateFlameImage(flameLevel, msgPerSec60, msgPerSec180);
                    return;
                }
                // Kıyaslama: son 60sn ortalaması, 180sn ortalamasından anlamlı yüksekse seviye artar, düşükse azalır
                if (msgPerSec60 > msgPerSec180 + 0.2) {
                    targetLevel = Math.min(maxLevel, flameLevel + 1);
                } else if (msgPerSec60 < msgPerSec180 - 0.2) {
                    targetLevel = Math.max(minLevel, flameLevel - 1);
                } else {
                    // Standart seviyelendirme
                    if (msgPerSec60 <= 0.2) targetLevel = 1;
                    else if (msgPerSec60 <= 0.5) targetLevel = 2;
                    else if (msgPerSec60 <= 1) targetLevel = 3;
                    else if (msgPerSec60 <= 2) targetLevel = 4;
                    else targetLevel = 5;
                }
                if (Date.now() - lastLevelChange > levelChangeDelay) {
                    if (flameLevel < targetLevel) flameLevel++;
                    else if (flameLevel > targetLevel) flameLevel--;
                    updateFlameImage(flameLevel, msgPerSec60, msgPerSec180);
                    lastLevelChange = Date.now();
                } else {
                    updateFlameImage(flameLevel, msgPerSec60, msgPerSec180);
                }
            }

            globalInterval = setInterval(updateFlameLevelByActivity, 1000);
            updateFlameImage(flameLevel, msgPerSec60, msgPerSec180);
            connectKickWebSocket();
        }

        // UI Kontrolleri
        const usernameInput = document.getElementById('usernameInput');
        const startBtn = document.getElementById('startBtn');
        const urlRow = document.getElementById('urlRow');
        const urlOutput = document.getElementById('urlOutput');
        const copyBtn = document.getElementById('copyBtn');
        const flame = document.getElementById('flame');
        const flameLevelLabel = document.getElementById('flameLevelLabel');
        const backgroundDiv = document.querySelector('.background');

        // Sayfa ilk açıldığında animasyon ve label gizli olsun
        flame.style.display = 'none';
        flameLevelLabel.textContent = '';

        // URL parametresiyle uyumlu seçili template'i ayarla
        const paramUsername = getParamFromUrl('username');
        const paramTemplate = getParamFromUrl('template');
        if (paramTemplate && templates.includes(paramTemplate)) {
            templateSelect.value = paramTemplate;
            currentTemplate = paramTemplate;
        } else {
            templateSelect.value = templates[0];
            currentTemplate = templates[0];
        }
        backgroundDiv.style.backgroundImage = `url('${getTemplateAssets(currentTemplate).background}')`;
        // Konumu güncelle
        const pos = getTemplateAssets(currentTemplate).position;
        flame.style.top = pos.top;
        flame.style.left = pos.left;
        if (paramUsername) {
            usernameInput.value = paramUsername;
            const url = `${window.location.origin}${window.location.pathname}?username=${encodeURIComponent(paramUsername)}&template=${encodeURIComponent(currentTemplate)}`;
            urlOutput.value = url;
            urlRow.style.display = 'flex';
            startFlame(paramUsername, currentTemplate);
        }

        // Template seçimi değişince arka planı ve alevi güncelle
        templateSelect.addEventListener('change', function() {
            currentTemplate = templateSelect.value;
            backgroundDiv.style.backgroundImage = `url('${getTemplateAssets(currentTemplate).background}')`;
            // Konumu güncelle
            const pos = getTemplateAssets(currentTemplate).position;
            flame.style.top = pos.top;
            flame.style.left = pos.left;
            // Alev animasyonu aktifse güncelle
            if (flame.style.display === 'block' && usernameInput.value.trim()) {
                startFlame(usernameInput.value.trim(), currentTemplate);
            }
        });

        // Start butonuna tıklanınca
        startBtn.addEventListener('click', function() {
            let username = usernameInput.value.trim() || 'Username';
            // URL oluştur
            const url = `${window.location.origin}${window.location.pathname}?username=${encodeURIComponent(username)}&template=${encodeURIComponent(currentTemplate)}`;
            // URL parametresini güncelle (sayfa yenilemeden)
            window.history.pushState({}, '', url);
            urlOutput.value = url;
            urlRow.style.display = 'flex';
            // Statları sıfırla
            flame.style.display = 'none';
            flameLevelLabel.textContent = '';
            // Konumu güncelle
            const pos = getTemplateAssets(currentTemplate).position;
            flame.style.top = pos.top;
            flame.style.left = pos.left;
            // Alev animasyonunu başlat
            startFlame(username, currentTemplate);
        });

        // Kopyala butonu
        copyBtn.addEventListener('click', function() {
            urlOutput.select();
            urlOutput.setSelectionRange(0, 99999);
            document.execCommand('copy');
            copyBtn.textContent = 'Kopyalandı!';
            setTimeout(() => copyBtn.textContent = 'Kopyala', 1200);
        });

        // Enter ile başlatma
        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                startBtn.click();
            }
        });
    </script>
</body>
</html>
