<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alev Animasyonu Demo (Kick WebSocket ile)</title>
    <style>
        body {
            background: #23272f;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
        }
        .main-card {
            background: #2d323c;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            padding: 32px 32px 24px 32px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 340px;
        }
        .container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 16px;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./flame/camp.jpg') no-repeat center center;
            background-size: contain;
            border-radius: 12px;
        }
        .flame {
            width: 64px;
            height: 64px;
            background: url('./flame/2.png') no-repeat;
            background-size: cover;
            position: absolute;
            top: 87px;
            left: 137px;
            animation: burn 0.8s steps(6) infinite;
            display: none;
        }
        @keyframes burn {
            from { background-position: 0 0; }
            to { background-position: calc(-1*6*64px) 0; }
        }
        .level-label {
            color: #fff;
            font-size: 1.2em;
            margin-top: 20px;
            margin-bottom: 0;
            min-height: 1.5em;
            text-align: center;
        }
        hr {
            border: none;
            border-top: 1.5px solid #444a57;
            width: 100%;
            margin: 32px 0 24px 0;
        }
        .form-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-row label {
            color: #bfc7d5;
            font-size: 1em;
        }
        .input-row input[type="text"] {
            padding: 7px 12px;
            border-radius: 6px;
            border: 1px solid #444a57;
            background: #23272f;
            color: #fff;
            font-size: 1em;
            outline: none;
            width: 140px;
        }
        .input-row button {
            background: #4f8cff;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 18px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-row button:hover {
            background: #2563eb;
        }
        .url-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .url-row input[type="text"] {
            width: 220px;
            font-size: 0.98em;
            background: #181b20;
            color: #bfc7d5;
            border: 1px solid #444a57;
            border-radius: 6px;
            padding: 6px 10px;
        }
        .url-row button {
            background: #3bb273;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.98em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .url-row button:hover {
            background: #238a53;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="container">
            <div class="background"></div>
            <div class="flame" id="flame"></div>
        </div>
        <div class="level-label" id="flameLevelLabel"></div>
        <hr>
        <div class="form-section">
            <div class="input-row">
                <label for="usernameInput">Kick Username:</label>
                <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
                <button id="startBtn">Start</button>
            </div>
            <div class="url-row" style="display:none;" id="urlRow">
                <input type="text" id="urlOutput" readonly>
                <button id="copyBtn">Copy</button>
            </div>
        </div>
    </div>
    <script>
        // Yardımcı fonksiyon: URL parametresinden username al
        function getUsernameFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('username');
        }

        // Kick API'den chatroom_id al
        async function getChatroomId(username) {
            const apiUrl = `https://kick.com/api/v2/channels/${username}/chatroom`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API hatası');
                const data = await response.json();
                return data.id;
            } catch (e) {
                alert('Chatroom ID alınamadı!');
                return null;
            }
        }

        // Alev animasyonu ve chat fonksiyonları
        async function startFlame(username) {
            const flame = document.getElementById('flame');
            const flameLevelLabel = document.getElementById('flameLevelLabel');
            flame.style.display = 'block';
            flameLevelLabel.textContent = 'Yükleniyor...';

            const CHATROOM_ID = await getChatroomId(username);
            if (!CHATROOM_ID) {
                flameLevelLabel.textContent = 'Alev Seviyesi: - | Mesaj/saniye: -';
                flame.style.display = 'none';
                return;
            }

            const KICK_WS_URL = "wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0-rc2&flash=false";
            let ws;
            let messageTimestamps = [];
            let flameLevel = 2;
            const minLevel = 1;
            const maxLevel = 5;
            let targetLevel = 2;
            let lastLevelChange = Date.now();
            const levelChangeDelay = 2000; // ms
            let msgPerSec = 0;

            function updateFlameImage(level, msgPerSec) {
                flame.style.backgroundImage = `url('./flame/${level}.png')`;
                flameLevelLabel.textContent = `Alev Seviyesi: ${level} | Mesaj/saniye: ${msgPerSec.toFixed(2)}`;
            }

            function connectKickWebSocket() {
                ws = new WebSocket(KICK_WS_URL);
                ws.onopen = function() {
                    const subscribePayload = {
                        event: "pusher:subscribe",
                        data: {
                            channel: `chatrooms.${CHATROOM_ID}.v2`
                        }
                    };
                    ws.send(JSON.stringify(subscribePayload));
                };
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.event === "App\\Events\\ChatMessageEvent") {
                            messageTimestamps.push(Date.now());
                        }
                    } catch (e) {}
                };
                ws.onclose = function() {
                    setTimeout(connectKickWebSocket, 3000);
                };
            }

            function updateFlameLevelByActivity() {
                const now = Date.now();
                messageTimestamps = messageTimestamps.filter(ts => now - ts < 60000);
                msgPerSec = messageTimestamps.length / 60;
                if (msgPerSec <= 0.2) targetLevel = 1;
                else if (msgPerSec <= 0.5) targetLevel = 2;
                else if (msgPerSec <= 1) targetLevel = 3;
                else if (msgPerSec <= 2) targetLevel = 4;
                else targetLevel = 5;
                if (Date.now() - lastLevelChange > levelChangeDelay) {
                    if (flameLevel < targetLevel) flameLevel++;
                    else if (flameLevel > targetLevel) flameLevel--;
                    updateFlameImage(flameLevel, msgPerSec);
                    lastLevelChange = Date.now();
                } else {
                    updateFlameImage(flameLevel, msgPerSec);
                }
            }

            setInterval(updateFlameLevelByActivity, 1000);
            updateFlameImage(flameLevel, msgPerSec);
            connectKickWebSocket();
        }

        // UI Kontrolleri
        const usernameInput = document.getElementById('usernameInput');
        const startBtn = document.getElementById('startBtn');
        const urlRow = document.getElementById('urlRow');
        const urlOutput = document.getElementById('urlOutput');
        const copyBtn = document.getElementById('copyBtn');
        const flame = document.getElementById('flame');
        const flameLevelLabel = document.getElementById('flameLevelLabel');

        // Sayfa ilk açıldığında animasyon ve label gizli olsun
        flame.style.display = 'none';
        flameLevelLabel.textContent = '';

        // Sayfa yüklenirken username parametresi varsa otomatik başlat
        const paramUsername = getUsernameFromUrl();
        if (paramUsername) {
            usernameInput.value = paramUsername;
            const url = `${window.location.origin}${window.location.pathname}?username=${encodeURIComponent(paramUsername)}`;
            urlOutput.value = url;
            urlRow.style.display = 'flex';
            startFlame(paramUsername);
        }

        // Start butonuna tıklanınca
        startBtn.addEventListener('click', function() {
            let username = usernameInput.value.trim() || 'Username';
            // URL oluştur
            const url = `${window.location.origin}${window.location.pathname}?username=${encodeURIComponent(username)}`;
            urlOutput.value = url;
            urlRow.style.display = 'flex';
            // Alev animasyonunu başlat
            startFlame(username);
        });

        // Kopyala butonu
        copyBtn.addEventListener('click', function() {
            urlOutput.select();
            urlOutput.setSelectionRange(0, 99999);
            document.execCommand('copy');
            copyBtn.textContent = 'Kopyalandı!';
            setTimeout(() => copyBtn.textContent = 'Kopyala', 1200);
        });

        // Enter ile başlatma
        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                startBtn.click();
            }
        });
    </script>
</body>
</html>
